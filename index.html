<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batch Crop</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0e0e0e;
        --surface: #161616;
        --surface2: #1f1f1f;
        --border: #2a2a2a;
        --accent: #f0c040;
        --accent2: #ff6b35;
        --text: #e8e8e8;
        --text-dim: #888;
        --mono: 'IBM Plex Mono', monospace;
        --sans: 'IBM Plex Sans', sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      header h1 {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      header .tag {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 2px;
      }

      .workspace {
        display: grid;
        grid-template-columns: 1fr 280px;
        flex: 1;
        overflow: hidden;
        height: calc(100vh - 53px);
      }

      /* MAIN CANVAS AREA */
      .canvas-area {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--border);
      }

      .canvas-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }

      .canvas-toolbar .coords {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        margin-left: auto;
      }

      .canvas-toolbar .coords span {
        color: var(--accent);
      }

      .canvas-wrap {
        flex: 1;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: repeating-conic-gradient(#1a1a1a 0% 25%, #141414 0% 50%) 0 0 / 20px 20px;
        position: relative;
      }

      .drop-zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        height: 100%;
        border: 2px dashed var(--border);
        margin: 32px;
        border-radius: 4px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }

      .drop-zone.drag-over {
        border-color: var(--accent);
        background: rgba(240, 192, 64, 0.05);
      }

      .drop-zone-icon {
        font-size: 40px;
        opacity: 0.3;
      }

      .drop-zone p {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
        text-align: center;
        line-height: 1.8;
      }

      .drop-zone p strong {
        color: var(--accent);
        font-weight: 500;
      }

      #preview-container {
        position: relative;
        display: none;
        cursor: crosshair;
        user-select: none;
        flex-shrink: 0;
      }

      #preview-img {
        display: block;
        max-width: none;
      }

      #crop-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
      }

      /* Dark mask around selection */
      .mask-top,
      .mask-bottom,
      .mask-left,
      .mask-right {
        position: absolute;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }

      #crop-box {
        position: absolute;
        border: 2px solid var(--accent);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px rgba(0, 0, 0, 0.5);
        pointer-events: auto;
        cursor: move;
        display: none;
      }

      /* Rule-of-thirds grid lines */
      #crop-box::before,
      #crop-box::after {
        content: '';
        position: absolute;
        inset: 0;
      }

      #crop-box::before {
        background:
          linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px) 33.33% 0 /
            33.33% 100%,
          linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px) 0 33.33% / 100%
            33.33%;
      }

      .handle {
        position: absolute;
        width: 10px;
        height: 10px;
        background: var(--accent);
        border: 1px solid #000;
        pointer-events: all;
        cursor: inherit;
      }

      .handle.tl {
        top: -5px;
        left: -5px;
        cursor: nw-resize;
      }
      .handle.tr {
        top: -5px;
        right: -5px;
        cursor: ne-resize;
      }
      .handle.bl {
        bottom: -5px;
        left: -5px;
        cursor: sw-resize;
      }
      .handle.br {
        bottom: -5px;
        right: -5px;
        cursor: se-resize;
      }
      .handle.tm {
        top: -5px;
        left: 50%;
        transform: translateX(-50%);
        cursor: n-resize;
      }
      .handle.bm {
        bottom: -5px;
        left: 50%;
        transform: translateX(-50%);
        cursor: s-resize;
      }
      .handle.ml {
        top: 50%;
        left: -5px;
        transform: translateY(-50%);
        cursor: w-resize;
      }
      .handle.mr {
        top: 50%;
        right: -5px;
        transform: translateY(-50%);
        cursor: e-resize;
      }

      /* SIDEBAR */
      .sidebar {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--surface);
      }

      .sidebar-section {
        border-bottom: 1px solid var(--border);
        padding: 14px 16px;
        flex-shrink: 0;
      }

      .sidebar-section h2 {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 12px;
      }

      .input-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .input-group label {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        margin-bottom: 4px;
        letter-spacing: 0.05em;
      }

      .input-group input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 8px;
        outline: none;
        border-radius: 2px;
        transition: border-color 0.15s;
      }

      .input-group input:focus {
        border-color: var(--accent);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 14px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-primary {
        background: var(--accent);
        color: #000;
      }

      .btn-primary:hover {
        background: #ffd060;
      }
      .btn-primary:disabled {
        background: #444;
        color: #666;
        cursor: not-allowed;
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid var(--border);
      }

      .btn-ghost:hover {
        border-color: var(--text-dim);
        color: var(--text);
      }

      .btn-full {
        width: 100%;
      }

      .file-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      .file-list::-webkit-scrollbar {
        width: 4px;
      }
      .file-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .file-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.1s;
        font-size: 11px;
        font-family: var(--mono);
        color: var(--text-dim);
      }

      .file-item:hover {
        background: var(--surface2);
      }

      .file-item.active {
        background: var(--surface2);
        border-color: var(--border);
        color: var(--text);
      }

      .file-item .status {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--border);
        flex-shrink: 0;
      }

      .file-item.done .status {
        background: #4caf50;
      }
      .file-item .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-item .info {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        opacity: 0.6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file-item .override-badge {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--accent2);
        flex-shrink: 0;
        margin-left: auto;
        align-self: center;
      }

      .empty-files {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 8px;
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 11px;
        text-align: center;
        padding: 20px;
      }

      .progress-bar {
        height: 3px;
        background: var(--surface2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s;
        width: 0%;
      }

      .status-text {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 6px;
      }

      .zoom-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .zoom-controls .zoom-val {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        min-width: 36px;
        text-align: center;
      }

      #reset-crop {
        margin-top: 8px;
      }

      .quality-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .quality-row label {
        flex-shrink: 0;
      }

      .template-legend {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--text-dim);
        margin-top: 4px;
        opacity: 0.7;
      }

      /* Range slider styling */
      input[type='range'] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        margin: 8px 0;
      }

      input[type='range']:focus {
        outline: none;
      }

      /* Track */
      input[type='range']::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: var(--surface2);
        border-radius: 2px;
        border: 1px solid var(--border);
      }
      input[type='range']::-moz-range-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: var(--surface2);
        border-radius: 2px;
        border: 1px solid var(--border);
      }

      /* Thumb */
      input[type='range']::-webkit-slider-thumb {
        height: 14px;
        width: 14px;
        border-radius: 2px;
        background: var(--accent);
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -6px; /* Centers thumb on the 4px track */
        border: none;
      }
      input[type='range']::-moz-range-thumb {
        height: 14px;
        width: 14px;
        border-radius: 2px;
        background: var(--accent);
        cursor: pointer;
        border: none;
      }

      input[type='range']:active::-webkit-slider-thumb {
        background: #ffd060;
      }
      input[type='range']:active::-moz-range-thumb {
        background: #ffd060;
      }
      .preset-chip {
        font-family: var(--mono);
        font-size: 10px;
        padding: 3px 7px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 2px;
        cursor: pointer;
        white-space: nowrap;
      }
      .preset-chip:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .user-preset-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .user-preset-row button.apply {
        flex: 1;
        text-align: left;
        font-family: var(--mono);
        font-size: 11px;
        padding: 4px 8px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 2px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-preset-row button.apply:hover {
        border-color: var(--accent);
      }
      .user-preset-row button.del {
        flex-shrink: 0;
        padding: 4px 7px;
        font-size: 12px;
        background: none;
        border: 1px solid var(--border);
        color: var(--text-dim);
        border-radius: 2px;
        cursor: pointer;
      }
      .user-preset-row button.del:hover {
        border-color: var(--accent2);
        color: var(--accent2);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Batch Crop</h1>
      <span class="tag">client-side · no upload</span>
    </header>

    <div class="workspace">
      <div class="canvas-area">
        <div class="canvas-toolbar">
          <div class="zoom-controls">
            <button class="btn btn-ghost" id="zoom-out" style="padding: 4px 8px">−</button>
            <span class="zoom-val" id="zoom-label">100%</span>
            <button class="btn btn-ghost" id="zoom-in" style="padding: 4px 8px">+</button>
            <button class="btn btn-ghost" id="zoom-fit" style="padding: 4px 8px; font-size: 10px">
              Fit
            </button>
          </div>
          <div class="coords" id="coords-display">drag to select crop region</div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-icon">⬚</div>
            <p>
              Drop images here
              <br />
              <strong>or click to browse</strong>
              <br />
              <span style="opacity: 0.5">PNG, JPG, WEBP · multiple files OK</span>
            </p>
            <input type="file" id="file-input" accept="image/*" multiple style="display: none" />
          </div>
          <div id="preview-container">
            <img id="preview-img" draggable="false" />
            <div id="crop-overlay"></div>
            <div id="crop-box">
              <div class="handle tl" data-handle="tl"></div>
              <div class="handle tm" data-handle="tm"></div>
              <div class="handle tr" data-handle="tr"></div>
              <div class="handle ml" data-handle="ml"></div>
              <div class="handle mr" data-handle="mr"></div>
              <div class="handle bl" data-handle="bl"></div>
              <div class="handle bm" data-handle="bm"></div>
              <div class="handle br" data-handle="br"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar">
        <div class="sidebar-section">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 12px;
            "
          >
            <h2 style="margin-bottom: 0">Crop</h2>
            <div style="display: flex; gap: 4px; align-items: center">
              <button
                class="btn btn-ghost"
                id="crop-mode-btn"
                style="padding: 2px 8px; font-size: 10px; font-family: var(--mono)"
              >
                px
              </button>
              <button
                class="btn btn-ghost"
                id="crop-collapse-btn"
                style="padding: 2px 8px; font-size: 10px; font-family: var(--mono)"
              >
                ▾
              </button>
            </div>
          </div>
          <div id="crop-body">
            <div class="input-grid">
              <div class="input-group">
                <label>X</label>
                <input type="number" id="crop-x" value="0" min="0" />
              </div>
              <div class="input-group">
                <label>Y</label>
                <input type="number" id="crop-y" value="0" min="0" />
              </div>
              <div class="input-group">
                <label>Width</label>
                <input type="number" id="crop-w" value="0" min="1" />
              </div>
              <div class="input-group">
                <label>Height</label>
                <input type="number" id="crop-h" value="0" min="1" />
              </div>
            </div>
            <div style="margin-top: 8px">
              <div class="input-group">
                <label>Ratio</label>
                <div style="display: flex; gap: 6px; align-items: center">
                  <select
                    id="ratio-select"
                    style="
                      flex: 1;
                      background: var(--surface2);
                      border: 1px solid var(--border);
                      color: var(--text);
                      font-family: var(--mono);
                      font-size: 12px;
                      padding: 6px 8px;
                      outline: none;
                      border-radius: 2px;
                    "
                  >
                    <option value="free">Free</option>
                    <option value="1">1:1</option>
                    <option value="1.3333">4:3</option>
                    <option value="1.5">3:2</option>
                    <option value="1.7778">16:9</option>
                    <option value="custom">Custom</option>
                  </select>
                  <button
                    id="invert-ratio"
                    class="btn btn-ghost"
                    style="padding: 6px; flex-shrink: 0"
                    title="Invert Ratio"
                  >
                    ⇅
                  </button>
                  <span
                    id="custom-ratio-inputs"
                    style="display: none; gap: 4px; align-items: center"
                  >
                    <input
                      type="number"
                      id="ratio-w"
                      value="16"
                      min="1"
                      style="
                        width: 40px;
                        background: var(--surface2);
                        border: 1px solid var(--border);
                        color: var(--text);
                        font-family: var(--mono);
                        font-size: 12px;
                        padding: 4px 6px;
                        outline: none;
                        border-radius: 2px;
                      "
                    />
                    <span style="color: var(--text-dim); font-family: var(--mono); font-size: 12px">
                      :
                    </span>
                    <input
                      type="number"
                      id="ratio-h"
                      value="9"
                      min="1"
                      style="
                        width: 40px;
                        background: var(--surface2);
                        border: 1px solid var(--border);
                        color: var(--text);
                        font-family: var(--mono);
                        font-size: 12px;
                        padding: 4px 6px;
                        outline: none;
                        border-radius: 2px;
                      "
                    />
                  </span>
                </div>
              </div>
            </div>
            <button class="btn btn-ghost btn-full" id="reset-crop">Reset Selection</button>
            <button class="btn btn-ghost btn-full" id="save-override" style="margin-top: 4px">
              Save crop for this file
            </button>
            <button
              class="btn btn-ghost btn-full"
              id="clear-override"
              style="margin-top: 4px; display: none"
            >
              Clear file override
            </button>
            <button
              class="btn btn-ghost btn-full"
              id="detect-faces-btn"
              style="margin-top: 4px; display: none"
              title="Auto-suggest a crop region based on detected faces"
            >
              ◉ Detect Faces
            </button>
            <div
              id="detect-faces-status"
              style="
                font-family: var(--mono);
                font-size: 10px;
                color: var(--text-dim);
                margin-top: 4px;
                display: none;
              "
            ></div>
          </div>
        </div>

        <div class="sidebar-section" id="presets-section" style="flex-shrink: 0">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 10px;
            "
          >
            <h2 style="margin-bottom: 0">Presets</h2>
            <button
              class="btn btn-ghost"
              id="presets-toggle"
              style="padding: 2px 8px; font-size: 10px; font-family: var(--mono)"
            >
              ▾
            </button>
          </div>
          <div id="presets-body">
            <div
              id="builtin-presets"
              style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px"
            ></div>
            <div style="display: flex; gap: 6px; margin-bottom: 6px">
              <input
                type="text"
                id="preset-name-input"
                placeholder="Name current crop…"
                style="flex: 1; font-size: 11px"
              />
              <button
                class="btn btn-ghost"
                id="save-preset-btn"
                style="font-size: 11px; white-space: nowrap"
              >
                Save
              </button>
            </div>
            <div
              id="user-presets"
              style="
                display: flex;
                flex-direction: column;
                gap: 4px;
                max-height: 120px;
                overflow-y: auto;
              "
            ></div>
          </div>
        </div>

        <div class="sidebar-section">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-bottom: 12px;
            "
          >
            <h2 style="margin-bottom: 0">Export</h2>
            <button
              class="btn btn-ghost"
              id="export-collapse-btn"
              style="padding: 2px 8px; font-size: 10px; font-family: var(--mono)"
            >
              ▾
            </button>
          </div>
          <div id="export-body">
            <div style="display: flex; gap: 6px; margin-bottom: 10px">
              <button
                class="btn btn-ghost"
                id="flip-h-btn"
                style="flex: 1"
                title="Flip horizontal on export"
              >
                ⇄ Flip H
              </button>
              <button
                class="btn btn-ghost"
                id="flip-v-btn"
                style="flex: 1"
                title="Flip vertical on export"
              >
                ⇅ Flip V
              </button>
            </div>
            <div style="margin-bottom: 8px">
              <div class="input-group">
                <label>Format</label>
                <select
                  id="export-format"
                  style="
                    width: 100%;
                    background: var(--surface2);
                    border: 1px solid var(--border);
                    color: var(--text);
                    font-family: var(--mono);
                    font-size: 12px;
                    padding: 6px 8px;
                    outline: none;
                    border-radius: 2px;
                  "
                >
                  <option value="image/png">PNG</option>
                  <option value="image/jpeg">JPEG</option>
                  <option value="image/webp">WEBP</option>
                </select>
              </div>
              <div
                class="input-group"
                id="quality-container"
                style="display: none; margin-top: 8px"
              >
                <label>
                  Quality (
                  <span id="quality-val">95</span>
                  %)
                </label>
                <input
                  type="range"
                  id="export-quality"
                  min="0.01"
                  max="1.00"
                  step="0.01"
                  value="0.95"
                  style="width: 100%"
                />
              </div>
              <div class="input-group" style="margin-top: 8px">
                <label>Filename Template</label>
                <input
                  type="text"
                  id="filename-template"
                  value="{name}_cropped"
                  placeholder="{name}_cropped"
                />
                <div class="template-legend">{name} {w} {h} {idx}</div>
              </div>
            </div>
            <div class="input-group" style="margin-top: 8px">
              <label style="display: flex; align-items: center; justify-content: space-between">
                Resize Output
                <input type="checkbox" id="resize-enabled-chk" />
              </label>
              <div id="resize-inputs" style="display: none; margin-top: 6px">
                <div style="display: flex; gap: 6px; margin-bottom: 6px">
                  <div style="flex: 1">
                    <label
                      style="
                        font-family: var(--mono);
                        font-size: 10px;
                        color: var(--text-dim);
                        display: block;
                        margin-bottom: 4px;
                      "
                    >
                      W (px)
                    </label>
                    <input
                      type="number"
                      id="resize-w"
                      min="1"
                      placeholder="auto"
                      style="width: 100%"
                    />
                  </div>
                  <div style="flex: 1">
                    <label
                      style="
                        font-family: var(--mono);
                        font-size: 10px;
                        color: var(--text-dim);
                        display: block;
                        margin-bottom: 4px;
                      "
                    >
                      H (px)
                    </label>
                    <input
                      type="number"
                      id="resize-h"
                      min="1"
                      placeholder="auto"
                      style="width: 100%"
                    />
                  </div>
                </div>
                <select
                  id="resize-mode-select"
                  style="
                    width: 100%;
                    background: var(--surface2);
                    border: 1px solid var(--border);
                    color: var(--text);
                    font-family: var(--mono);
                    font-size: 12px;
                    padding: 6px 8px;
                    outline: none;
                    border-radius: 2px;
                  "
                >
                  <option value="fit">Fit (letterbox)</option>
                  <option value="fill">Fill (clip edges)</option>
                  <option value="stretch">Stretch</option>
                </select>
              </div>
            </div>
            <button
              class="btn btn-ghost btn-full"
              id="download-active-btn"
              disabled
              style="margin-bottom: 8px"
            >
              ▼ Download Active File
            </button>
            <button class="btn btn-primary btn-full" id="export-btn" disabled>
              ▼ Download All Cropped
            </button>
            <div class="progress-bar" id="progress-bar" style="display: none">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-text" id="status-text"></div>
          </div>
        </div>

        <div
          class="sidebar-section"
          style="
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
          "
        >
          <h2 style="margin-bottom: 0; flex-shrink: 0">
            Files
            <span id="file-count" style="color: var(--text-dim)">0</span>
          </h2>
          <select
            id="sort-select"
            style="
              flex: 1;
              min-width: 0;
              background: var(--surface2);
              border: 1px solid var(--border);
              color: var(--text-dim);
              font-family: var(--mono);
              font-size: 10px;
              padding: 2px 4px;
              outline: none;
              border-radius: 2px;
            "
          >
            <option value="none">Added</option>
            <option value="name-asc">Name A→Z</option>
            <option value="name-desc">Name Z→A</option>
            <option value="size-asc">Size ↑</option>
            <option value="size-desc">Size ↓</option>
            <option value="status">Done last</option>
          </select>
          <button
            class="btn btn-ghost"
            id="clear-done-btn"
            style="padding: 2px 6px; font-size: 10px; flex-shrink: 0; display: none"
          >
            Clear Done
          </button>
          <button
            class="btn btn-ghost"
            id="clear-files"
            style="padding: 2px 6px; font-size: 10px; flex-shrink: 0"
          >
            Clear
          </button>
        </div>
        <div class="file-list" id="file-list">
          <div class="empty-files">
            <span style="font-size: 24px; opacity: 0.2">⬚</span>
            Drop images to get started
          </div>
        </div>
      </div>
    </div>

    <script>
      // State
      let files = [];
      let activeIndex = 0;
      let zoom = 1;
      let batchCrop = { x: 0, y: 0, w: 0, h: 0 }; // in image pixels
      let activeCrop = batchCrop;
      let exportQuality = 0.95;
      let filenameTemplate = '{name}_cropped';
      let aspectRatio = null; // null = free; positive number = width/height ratio
      let imgNatW = 0,
        imgNatH = 0;
      let isDragging = false;
      let dragMode = null; // 'new', 'move', 'tl','tr','bl','br','tm','bm','ml','mr'
      let dragStart = { x: 0, y: 0 };
      let cropStart = { x: 0, y: 0, w: 0, h: 0 };
      // Undo/Redo
      const HISTORY_LIMIT = 50;
      let cropHistory = [];
      let historyIndex = -1;
      // Pinch-to-zoom
      const activePointers = new Map(); // pointerId -> {x, y}
      let pinchStartDist = 0;
      let pinchStartZoom = 1;
      // Swipe navigation
      let swipeStartX = 0;
      let swipeStartY = 0;
      let flipH = false;
      let flipV = false;
      let cropMode = 'px'; // 'px' | 'pct'
      let userPresets = []; // [{name, x, y, w, h}, ...]
      let sortOrder = 'none';
      let resizeEnabled = false;
      let resizeW = 0;
      let resizeH = 0;
      let resizeMode = 'fit'; // 'fit' | 'fill' | 'stretch'
      const sectionCollapsed = { crop: false, presets: false, export: false };

      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const previewContainer = document.getElementById('preview-container');
      const previewImg = document.getElementById('preview-img');
      const cropBox = document.getElementById('crop-box');
      const cropOverlay = document.getElementById('crop-overlay');
      const coordsDisplay = document.getElementById('coords-display');
      const exportBtn = document.getElementById('export-btn');
      const fileList = document.getElementById('file-list');
      const fileCount = document.getElementById('file-count');
      const clearFilesBtn = document.getElementById('clear-files');
      const clearDoneBtn = document.getElementById('clear-done-btn');
      const sortSelect = document.getElementById('sort-select');
      const progressBar = document.getElementById('progress-bar');
      const progressFill = document.getElementById('progress-fill');
      const statusText = document.getElementById('status-text');
      const canvasWrap = document.getElementById('canvas-wrap');

      // Export settings elements
      const qualityContainer = document.getElementById('quality-container');
      const exportQualityInput = document.getElementById('export-quality');
      const qualityVal = document.getElementById('quality-val');
      const filenameTemplateInput = document.getElementById('filename-template');
      const downloadActiveBtn = document.getElementById('download-active-btn');
      const resizeEnabledChk = document.getElementById('resize-enabled-chk');
      const resizeInputsDiv = document.getElementById('resize-inputs');
      const resizeWInput = document.getElementById('resize-w');
      const resizeHInput = document.getElementById('resize-h');
      const resizeModeSelect = document.getElementById('resize-mode-select');
      const detectFacesBtn = document.getElementById('detect-faces-btn');
      const detectFacesStatus = document.getElementById('detect-faces-status');

      if ('FaceDetector' in window) {
        detectFacesBtn.style.display = 'block';
      }

      // Inputs
      const inX = document.getElementById('crop-x');
      const inY = document.getElementById('crop-y');
      const inW = document.getElementById('crop-w');
      const inH = document.getElementById('crop-h');

      // Drop zone
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => loadFiles(Array.from(e.target.files)));
      clearFilesBtn.addEventListener('click', clearFiles);
      clearDoneBtn.addEventListener('click', () => {
        if (!files.some((f) => f.done)) return;
        const activeFile = files[activeIndex];
        files = files.filter((f) => !f.done);
        if (!files.length) {
          clearFiles();
          return;
        }
        activeIndex = files.indexOf(activeFile);
        if (activeIndex < 0) {
          activeIndex = 0;
          showPreview(0);
        }
        renderFileList();
      });

      fileList.addEventListener(
        'touchstart',
        (e) => {
          swipeStartX = e.touches[0].clientX;
          swipeStartY = e.touches[0].clientY;
        },
        { passive: true }
      );

      fileList.addEventListener(
        'touchend',
        (e) => {
          if (!files.length) return;
          const dx = e.changedTouches[0].clientX - swipeStartX;
          const dy = e.changedTouches[0].clientY - swipeStartY;
          if (Math.abs(dx) <= 40 || Math.abs(dy) >= 60) return;
          if (dx < 0 && activeIndex < files.length - 1) {
            activeIndex++;
          } else if (dx > 0 && activeIndex > 0) {
            activeIndex--;
          } else {
            return;
          }
          showPreview(activeIndex);
          renderFileList();
        },
        { passive: true }
      );

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');
        loadFiles(Array.from(e.dataTransfer.files).filter((f) => f.type.startsWith('image/')));
      });

      // Also handle drop on canvas wrap when files are loaded (stopPropagation prevents double-firing with dropZone)
      canvasWrap.addEventListener('dragover', (e) => e.preventDefault());
      canvasWrap.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const newFiles = Array.from(e.dataTransfer.files).filter((f) =>
          f.type.startsWith('image/')
        );
        if (newFiles.length) loadFiles([...files.map((f) => f.file), ...newFiles]);
      });

      function formatSize(bytes) {
        if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        return Math.round(bytes / 1024) + ' KB';
      }

      function resolveTemplate(template, data) {
        return template
          .replace(/{name}/g, data.name)
          .replace(/{w}/g, Math.round(data.w))
          .replace(/{h}/g, Math.round(data.h))
          .replace(/{idx}/g, data.idx);
      }

      function loadFiles(fileArr) {
        if (!fileArr.length) return;
        files = fileArr.map((f, i) => ({
          file: f,
          done: false,
          crop: null,
          info: null,
          originalIndex: i,
        }));
        activeIndex = 0;
        cropHistory = [];
        historyIndex = -1;
        Object.assign(batchCrop, { x: 0, y: 0, w: 0, h: 0 });
        activeCrop = batchCrop;
        renderFileList();
        applySortOrder(); // keep list sorted after new files are loaded
        showPreview(0);
        (async () => {
          const localFiles = files; // snapshot — immune to replacement if loadFiles() is called again
          for (let i = 0; i < localFiles.length; i++) {
            if (localFiles[i].info) continue;
            await new Promise((resolve) => {
              const img = new Image();
              const url = URL.createObjectURL(localFiles[i].file);
              img.onload = () => {
                localFiles[i].info = {
                  w: img.naturalWidth,
                  h: img.naturalHeight,
                  size: localFiles[i].file.size,
                };
                URL.revokeObjectURL(url);
                renderFileList();
                resolve();
              };
              img.onerror = resolve;
              img.src = url;
            });
          }
        })();
      }

      function updateClearDoneVisibility() {
        clearDoneBtn.style.display = files.some((f) => f.done) ? 'inline-block' : 'none';
      }

      function initCollapsible(toggleBtnId, bodyId, settingsKey) {
        const btn = document.getElementById(toggleBtnId);
        const body = document.getElementById(bodyId);
        function apply(collapsed) {
          body.style.display = collapsed ? 'none' : '';
          body.parentElement.style.paddingBottom = collapsed ? '0' : '';
          btn.textContent = collapsed ? '\u25b8' : '\u25be';
        }
        btn.addEventListener('click', () => {
          const collapsed = body.style.display !== 'none';
          apply(collapsed);
          sectionCollapsed[settingsKey] = collapsed;
          saveSettings();
        });
        apply(sectionCollapsed[settingsKey]);
      }

      function clearFiles() {
        files = [];
        activeIndex = 0;
        cropHistory = [];
        historyIndex = -1;
        Object.assign(batchCrop, { x: 0, y: 0, w: 0, h: 0 });
        activeCrop = batchCrop;
        renderFileList();

        // Reset UI
        previewContainer.style.display = 'none';
        dropZone.style.display = 'flex';
        exportBtn.disabled = true;
        downloadActiveBtn.disabled = true;
        fileInput.value = ''; // Allow selecting same files again

        // Reset crop inputs
        inX.value = 0;
        inY.value = 0;
        inW.value = 0;
        inH.value = 0;

        updateCropBoxVisual();
      }

      function updateOverrideButtons() {
        const hasOverride = !!files[activeIndex]?.crop;
        document.getElementById('clear-override').style.display = hasOverride ? 'block' : 'none';
      }

      function renderFileList() {
        const prevScroll = fileList.scrollTop;
        fileCount.textContent = files.length;
        fileList.innerHTML = '';
        files.forEach((f, i) => {
          const div = document.createElement('div');
          div.className =
            'file-item' + (i === activeIndex ? ' active' : '') + (f.done ? ' done' : '');
          // Build info text
          const infoText = f.info
            ? `${f.info.w} x ${f.info.h} - ${formatSize(f.file.size)}`
            : `... x ... - ${formatSize(f.file.size)}`;

          const statusDot = document.createElement('div');
          statusDot.className = 'status';

          const nameEl = document.createElement('div');
          nameEl.className = 'name';
          nameEl.textContent = f.file.name; // textContent is safe — no XSS risk

          const infoEl = document.createElement('div');
          infoEl.className = 'info';
          infoEl.textContent = infoText;

          const textWrap = document.createElement('div');
          textWrap.style.cssText = 'min-width:0;flex:1;overflow:hidden;';
          textWrap.appendChild(nameEl);
          textWrap.appendChild(infoEl);

          div.appendChild(statusDot);
          div.appendChild(textWrap);
          if (f.crop) {
            const badge = document.createElement('span');
            badge.className = 'override-badge';
            badge.textContent = 'custom';
            div.appendChild(badge);
          }
          div.addEventListener('click', () => {
            activeIndex = i;
            showPreview(i);
            renderFileList();
          });
          fileList.appendChild(div);
        });
        fileList.scrollTop = prevScroll;
        updateOverrideButtons();
        updateClearDoneVisibility();
      }

      function showPreview(idx) {
        cropHistory = [];
        historyIndex = -1;
        const f = files[idx];
        if (!f) return;
        const url = URL.createObjectURL(f.file);
        previewImg.onload = () => {
          imgNatW = previewImg.naturalWidth;
          imgNatH = previewImg.naturalHeight;
          activeCrop = files[idx].crop ?? batchCrop;
          if (!files[idx].info) {
            files[idx].info = { w: imgNatW, h: imgNatH, size: files[idx].file.size };
            renderFileList();
          }
          URL.revokeObjectURL(url);
          // auto-fit
          const wrap = canvasWrap;
          const scaleX = (wrap.clientWidth - 64) / imgNatW;
          const scaleY = (wrap.clientHeight - 64) / imgNatH;
          zoom = Math.min(1, scaleX, scaleY);
          applyZoom();
          updateInputs();
          updateCropBoxVisual();
        };
        previewImg.src = url;
        dropZone.style.display = 'none';
        previewContainer.style.display = 'block';
        exportBtn.disabled = false;
        downloadActiveBtn.disabled = false;
        updateOverrideButtons();
      }

      function applyZoom() {
        previewImg.style.width = imgNatW * zoom + 'px';
        previewImg.style.height = imgNatH * zoom + 'px';
        previewContainer.style.width = imgNatW * zoom + 'px';
        previewContainer.style.height = imgNatH * zoom + 'px';
        document.getElementById('zoom-label').textContent = Math.round(zoom * 100) + '%';
        updateCropBoxVisual();
      }

      filenameTemplateInput.addEventListener('input', (e) => {
        filenameTemplate = e.target.value;
        saveSettings();
      });

      exportQualityInput.addEventListener('input', (e) => {
        exportQuality = parseFloat(e.target.value);
        qualityVal.textContent = Math.round(exportQuality * 100);
        saveSettings();
      });

      document.getElementById('export-format').addEventListener('change', (e) => {
        const format = e.target.value;
        qualityContainer.style.display =
          format === 'image/jpeg' || format === 'image/webp' ? 'block' : 'none';
        saveSettings();
      });

      // Zoom controls
      document.getElementById('zoom-in').addEventListener('click', () => {
        zoom = Math.min(zoom * 1.25, 8);
        applyZoom();
        saveSettings();
      });
      document.getElementById('zoom-out').addEventListener('click', () => {
        zoom = Math.max(zoom / 1.25, 0.05);
        applyZoom();
        saveSettings();
      });
      document.getElementById('zoom-fit').addEventListener('click', () => {
        if (!imgNatW) return;
        const wrap = canvasWrap;
        const scaleX = (wrap.clientWidth - 64) / imgNatW;
        const scaleY = (wrap.clientHeight - 64) / imgNatH;
        zoom = Math.min(1, scaleX, scaleY);
        applyZoom();
        saveSettings();
      });

      // Input fields -> crop rect
      function inputsToCrop() {
        if (cropMode === 'pct' && imgNatW && imgNatH) {
          activeCrop.x = ((parseFloat(inX.value) || 0) / 100) * imgNatW;
          activeCrop.y = ((parseFloat(inY.value) || 0) / 100) * imgNatH;
          activeCrop.w = ((parseFloat(inW.value) || 0) / 100) * imgNatW;
          activeCrop.h = ((parseFloat(inH.value) || 0) / 100) * imgNatH;
        } else {
          activeCrop.x = parseInt(inX.value) || 0;
          activeCrop.y = parseInt(inY.value) || 0;
          activeCrop.w = parseInt(inW.value) || 0;
          activeCrop.h = parseInt(inH.value) || 0;
        }
        clampCrop();
        updateCropBoxVisual();
      }

      [inX, inY, inW, inH].forEach((el) => el.addEventListener('input', inputsToCrop));
      [inX, inY, inW, inH].forEach((el) => el.addEventListener('change', pushHistory));

      function applyResizeToCanvas(canvas, ctx, img, crop, format) {
        const cropW = Math.round(crop.w);
        const cropH = Math.round(crop.h);
        const cropX = Math.round(crop.x);
        const cropY = Math.round(crop.y);
        const safeCropW = cropW || 1;
        const safeCropH = cropH || 1;
        const targetW =
          resizeW || (resizeH ? Math.round((resizeH * safeCropW) / safeCropH) : safeCropW);
        const targetH =
          resizeH || (resizeW ? Math.round((resizeW * safeCropH) / safeCropW) : safeCropH);

        canvas.width = targetW;
        canvas.height = targetH;

        if (resizeMode === 'fit') {
          const scale = Math.min(targetW / cropW, targetH / cropH);
          const dw = Math.round(cropW * scale);
          const dh = Math.round(cropH * scale);
          const dx = Math.round((targetW - dw) / 2);
          const dy = Math.round((targetH - dh) / 2);
          if (format === 'image/jpeg') {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, targetW, targetH);
          }
          if (flipH || flipV) {
            ctx.translate(flipH ? targetW : 0, flipV ? targetH : 0);
            ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
          }
          ctx.drawImage(img, cropX, cropY, cropW, cropH, dx, dy, dw, dh);
        } else if (resizeMode === 'fill') {
          const scale = Math.max(targetW / cropW, targetH / cropH);
          const sw = targetW / scale;
          const sh = targetH / scale;
          const sx = Math.round(cropX + (cropW - sw) / 2);
          const sy = Math.round(cropY + (cropH - sh) / 2);
          if (flipH || flipV) {
            ctx.translate(flipH ? targetW : 0, flipV ? targetH : 0);
            ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
          }
          ctx.drawImage(img, sx, sy, Math.round(sw), Math.round(sh), 0, 0, targetW, targetH);
        } else {
          // stretch
          if (flipH || flipV) {
            ctx.translate(flipH ? targetW : 0, flipV ? targetH : 0);
            ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
          }
          ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, targetW, targetH);
        }
      }

      function clampCrop() {
        activeCrop.x = Math.max(0, Math.min(activeCrop.x, imgNatW - 1));
        activeCrop.y = Math.max(0, Math.min(activeCrop.y, imgNatH - 1));
        activeCrop.w = Math.max(1, Math.min(activeCrop.w, imgNatW - activeCrop.x));
        activeCrop.h = Math.max(1, Math.min(activeCrop.h, imgNatH - activeCrop.y));
      }
      function pushHistory() {
        const last = cropHistory[historyIndex];
        if (
          last &&
          last.x === activeCrop.x &&
          last.y === activeCrop.y &&
          last.w === activeCrop.w &&
          last.h === activeCrop.h
        )
          return;
        cropHistory = cropHistory.slice(0, historyIndex + 1);
        cropHistory.push({ ...activeCrop });
        if (cropHistory.length > HISTORY_LIMIT) cropHistory.shift();
        else historyIndex++;
      }

      function updateInputs() {
        if (cropMode === 'pct' && imgNatW && imgNatH) {
          inX.value = ((activeCrop.x / imgNatW) * 100).toFixed(1);
          inY.value = ((activeCrop.y / imgNatH) * 100).toFixed(1);
          inW.value = ((activeCrop.w / imgNatW) * 100).toFixed(1);
          inH.value = ((activeCrop.h / imgNatH) * 100).toFixed(1);
        } else {
          inX.value = Math.round(activeCrop.x);
          inY.value = Math.round(activeCrop.y);
          inW.value = Math.round(activeCrop.w);
          inH.value = Math.round(activeCrop.h);
        }
      }

      function updateCropBoxVisual() {
        if (!activeCrop.w || !activeCrop.h) {
          cropBox.style.display = 'none';
          cropOverlay.innerHTML = '';
          return;
        }
        cropBox.style.display = 'block';
        const sx = activeCrop.x * zoom;
        const sy = activeCrop.y * zoom;
        const sw = activeCrop.w * zoom;
        const sh = activeCrop.h * zoom;
        cropBox.style.left = sx + 'px';
        cropBox.style.top = sy + 'px';
        cropBox.style.width = sw + 'px';
        cropBox.style.height = sh + 'px';

        const iw = imgNatW * zoom;
        const ih = imgNatH * zoom;
        cropOverlay.innerHTML = `
    <div class="mask-top" style="left:0;top:0;width:${iw}px;height:${sy}px;"></div>
    <div class="mask-bottom" style="left:0;top:${sy + sh}px;width:${iw}px;height:${ih - sy - sh}px;"></div>
    <div class="mask-left" style="left:0;top:${sy}px;width:${sx}px;height:${sh}px;"></div>
    <div class="mask-right" style="left:${sx + sw}px;top:${sy}px;width:${iw - sx - sw}px;height:${sh}px;"></div>
  `;

        coordsDisplay.innerHTML = `<span>${Math.round(activeCrop.x)}, ${Math.round(activeCrop.y)}</span> &nbsp; <span>${Math.round(activeCrop.w)} × ${Math.round(activeCrop.h)}</span>`;
      }

      // Mouse crop interaction
      function imgPos(e) {
        const rect = previewImg.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / zoom,
          y: (e.clientY - rect.top) / zoom,
        };
      }

      previewContainer.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.currentTarget.setPointerCapture(e.pointerId);

        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activePointers.size >= 2) {
          isDragging = false;
          const pts = [...activePointers.values()];
          pinchStartDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          pinchStartZoom = zoom;
          return;
        }

        const handle = e.target.dataset.handle;
        dragStart = { x: e.clientX, y: e.clientY };
        cropStart = { ...activeCrop };
        isDragging = true;

        if (handle) {
          dragMode = handle;
          document.body.style.cursor = e.target.style.cursor;
        } else if (e.target === cropBox || e.target.closest('#crop-box') === cropBox) {
          dragMode = 'move';
          document.body.style.cursor = 'move';
        } else {
          // New selection
          const p = imgPos(e);
          Object.assign(activeCrop, { x: p.x, y: p.y, w: 0, h: 0 });
          cropStart = { ...activeCrop };
          dragMode = 'new';
          document.body.style.cursor = 'crosshair';
        }
      });

      previewContainer.addEventListener('pointermove', (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }
        if (activePointers.size >= 2) {
          const pts = [...activePointers.values()];
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          zoom = Math.min(8, Math.max(0.05, pinchStartZoom * (dist / pinchStartDist)));
          applyZoom();
          return;
        }
        if (!isDragging) return;
        const dx = (e.clientX - dragStart.x) / zoom;
        const dy = (e.clientY - dragStart.y) / zoom;

        if (dragMode === 'new') {
          const p = imgPos(e);
          const x = Math.min(cropStart.x, p.x);
          const y = Math.min(cropStart.y, p.y);
          let w = Math.abs(p.x - cropStart.x);
          let h = Math.abs(p.y - cropStart.y);
          if (aspectRatio) h = w / aspectRatio;
          Object.assign(activeCrop, { x, y, w, h });
        } else if (dragMode === 'move') {
          activeCrop.x = Math.max(0, Math.min(cropStart.x + dx, imgNatW - cropStart.w));
          activeCrop.y = Math.max(0, Math.min(cropStart.y + dy, imgNatH - cropStart.h));
        } else {
          let { x, y, w, h } = cropStart;

          if (dragMode.includes('l')) {
            x = cropStart.x + dx;
            w = cropStart.w - dx;
          }
          if (dragMode.includes('r')) {
            w = cropStart.w + dx;
          }
          if (dragMode.includes('t') && dragMode !== 'tr') {
            y = cropStart.y + dy;
            h = cropStart.h - dy;
          }
          if (dragMode.includes('b') && dragMode !== 'bl') {
            h = cropStart.h + dy;
          }
          // Edge handles (tm/bm/ml/mr) intentionally do not enforce aspectRatio
          if (dragMode === 'tm') {
            y = cropStart.y + dy;
            h = cropStart.h - dy;
          }
          if (dragMode === 'bm') {
            h = cropStart.h + dy;
          }
          if (dragMode === 'ml') {
            x = cropStart.x + dx;
            w = cropStart.w - dx;
          }
          if (dragMode === 'mr') {
            w = cropStart.w + dx;
          }

          if (w < 1) {
            w = 1;
          }
          if (h < 1) {
            h = 1;
          }

          // Apply aspect ratio constraint for corner handles
          if (aspectRatio && ['tl', 'tr', 'bl', 'br'].includes(dragMode)) {
            h = w / aspectRatio;
          }

          Object.assign(activeCrop, { x, y, w, h });
        }

        clampCrop();
        updateInputs();
        updateCropBoxVisual();
      });

      previewContainer.addEventListener('pointerup', (e) => {
        activePointers.delete(e.pointerId);
        if (!isDragging) return;
        isDragging = false;
        document.body.style.cursor = '';
        clampCrop();
        updateInputs();
        updateCropBoxVisual();
        pushHistory();
      });

      // Reset crop
      document.getElementById('save-override').addEventListener('click', () => {
        if (!files[activeIndex]) return;
        if (!activeCrop.w || !activeCrop.h) return; // don't save a zero-area crop
        files[activeIndex].crop = { ...activeCrop };
        activeCrop = files[activeIndex].crop;
        renderFileList();
      });

      document.getElementById('clear-override').addEventListener('click', () => {
        if (!files[activeIndex]) return;
        files[activeIndex].crop = null;
        activeCrop = batchCrop;
        updateInputs();
        updateCropBoxVisual();
        renderFileList();
      });

      detectFacesBtn.addEventListener('click', async () => {
        if (!imgNatW || !files[activeIndex]) return;

        detectFacesBtn.disabled = true;
        detectFacesStatus.style.display = 'block';
        detectFacesStatus.textContent = 'Detecting…';

        try {
          const detector = new FaceDetector({ fastMode: false });
          const faces = await detector.detect(previewImg);

          if (!faces.length) {
            detectFacesStatus.textContent = 'No faces detected.';
            detectFacesBtn.disabled = false;
            return;
          }

          // Compute union bounding box of all detected faces.
          // FaceDetector returns coords in the element's display space, so divide by zoom.
          let minX = Infinity,
            minY = Infinity,
            maxX = -Infinity,
            maxY = -Infinity;
          for (const face of faces) {
            const b = face.boundingBox;
            minX = Math.min(minX, b.left / zoom);
            minY = Math.min(minY, b.top / zoom);
            maxX = Math.max(maxX, (b.left + b.width) / zoom);
            maxY = Math.max(maxY, (b.top + b.height) / zoom);
          }

          // Add 10% padding around the detected region
          const padX = (maxX - minX) * 0.1;
          const padY = (maxY - minY) * 0.1;
          activeCrop.x = Math.max(0, minX - padX);
          activeCrop.y = Math.max(0, minY - padY);
          activeCrop.w = Math.min(imgNatW - activeCrop.x, maxX - minX + padX * 2);
          activeCrop.h = Math.min(imgNatH - activeCrop.y, maxY - minY + padY * 2);

          clampCrop();
          updateInputs();
          updateCropBoxVisual();
          pushHistory();

          const count = faces.length;
          detectFacesStatus.textContent = `${count} face${count > 1 ? 's' : ''} detected.`;
        } catch (err) {
          detectFacesStatus.textContent = 'Detection failed: ' + err.message;
        }

        detectFacesBtn.disabled = false;
      });

      document.getElementById('reset-crop').addEventListener('click', () => {
        // Note: intentionally resets to full image, does not snap to aspectRatio
        Object.assign(activeCrop, { x: 0, y: 0, w: imgNatW, h: imgNatH });
        updateInputs();
        updateCropBoxVisual();
        pushHistory();
      });

      // Export
      document.getElementById('export-btn').addEventListener('click', async () => {
        if (!files.length) return;
        const uncropped = files.some((f) => {
          const c = f.crop ?? batchCrop;
          return !c.w || !c.h;
        });
        if (uncropped) {
          statusText.textContent = 'Select a crop region first (some files have no crop set).';
          return;
        }

        const format = document.getElementById('export-format').value;
        const ext = format === 'image/png' ? 'png' : format === 'image/jpeg' ? 'jpg' : 'webp';
        const total = files.length;

        progressBar.style.display = 'block';
        exportBtn.disabled = true;
        statusText.textContent = 'Loading JSZip...';

        // Load JSZip dynamically
        await new Promise((resolve, reject) => {
          if (window.JSZip) return resolve();
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });

        const zip = new JSZip();

        for (let i = 0; i < total; i++) {
          const f = files[i];
          statusText.textContent = `Processing ${i + 1}/${total}: ${f.file.name}`;
          progressFill.style.width = (i / total) * 100 + '%';

          const crop = f.crop ?? batchCrop;
          const blob = await new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(f.file);
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = Math.round(crop.w);
              canvas.height = Math.round(crop.h);
              const ctx = canvas.getContext('2d');
              if (resizeEnabled && (resizeW || resizeH)) {
                applyResizeToCanvas(canvas, ctx, img, crop, format);
              } else {
                if (flipH || flipV) {
                  ctx.translate(flipH ? canvas.width : 0, flipV ? canvas.height : 0);
                  ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
                }
                ctx.drawImage(
                  img,
                  Math.round(crop.x),
                  Math.round(crop.y),
                  Math.round(crop.w),
                  Math.round(crop.h),
                  0,
                  0,
                  Math.round(crop.w),
                  Math.round(crop.h)
                );
              }
              URL.revokeObjectURL(url);
              canvas.toBlob(resolve, format, exportQuality);
            };
            img.src = url;
          });

          const nameParts = f.file.name.split('.');
          const baseName = nameParts.slice(0, -1).join('.');
          const rCropW = Math.round(crop.w) || 1;
          const rCropH = Math.round(crop.h) || 1;
          const outW = resizeEnabled
            ? resizeW || (resizeH ? Math.round((resizeH * rCropW) / rCropH) : rCropW)
            : rCropW;
          const outH = resizeEnabled
            ? resizeH || (resizeW ? Math.round((resizeW * rCropH) / rCropW) : rCropH)
            : rCropH;
          const resolvedBase = resolveTemplate(filenameTemplate, {
            name: baseName,
            w: outW,
            h: outH,
            idx: i + 1,
          });
          const filename = resolvedBase + '.' + ext;
          zip.file(filename, blob);
          f.done = true;
          renderFileList();
        }

        statusText.textContent = 'Generating zip...';
        progressFill.style.width = '99%';

        const zipBlob = await zip.generateAsync({ type: 'blob' }, (meta) => {
          progressFill.style.width = 99 + meta.percent * 0.01 + '%';
        });

        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipBlob);
        a.download = `cropped_${total}_files.zip`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);

        progressFill.style.width = '100%';
        statusText.textContent = `Done - ${total} file${total > 1 ? 's' : ''} zipped and downloaded`;
        exportBtn.disabled = false;
      });

      async function downloadActiveFile() {
        const f = files[activeIndex];
        if (!f) return;
        const crop = f.crop ?? batchCrop;
        if (!crop.w || !crop.h) {
          statusText.textContent = 'Select a crop region first.';
          return;
        }

        const format = document.getElementById('export-format').value;
        const ext = format === 'image/png' ? 'png' : format === 'image/jpeg' ? 'jpg' : 'webp';

        statusText.textContent = `Processing ${f.file.name}...`;

        const blob = await new Promise((resolve) => {
          const img = new Image();
          const url = URL.createObjectURL(f.file);
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(crop.w);
            canvas.height = Math.round(crop.h);
            const ctx = canvas.getContext('2d');
            if (resizeEnabled && (resizeW || resizeH)) {
              applyResizeToCanvas(canvas, ctx, img, crop, format);
            } else {
              if (flipH || flipV) {
                ctx.translate(flipH ? canvas.width : 0, flipV ? canvas.height : 0);
                ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
              }
              ctx.drawImage(
                img,
                Math.round(crop.x),
                Math.round(crop.y),
                Math.round(crop.w),
                Math.round(crop.h),
                0,
                0,
                Math.round(crop.w),
                Math.round(crop.h)
              );
            }
            URL.revokeObjectURL(url);
            canvas.toBlob(resolve, format, exportQuality);
          };
          img.src = url;
        });

        const nameParts = f.file.name.split('.');
        const baseName = nameParts.slice(0, -1).join('.');
        const rCropW = Math.round(crop.w) || 1;
        const rCropH = Math.round(crop.h) || 1;
        const outW = resizeEnabled
          ? resizeW || (resizeH ? Math.round((resizeH * rCropW) / rCropH) : rCropW)
          : rCropW;
        const outH = resizeEnabled
          ? resizeH || (resizeW ? Math.round((resizeW * rCropH) / rCropW) : rCropH)
          : rCropH;
        const resolvedBase = resolveTemplate(filenameTemplate, {
          name: baseName,
          w: outW,
          h: outH,
          idx: activeIndex + 1,
        });
        const filename = resolvedBase + '.' + ext;

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        files[activeIndex].done = true;
        renderFileList();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        statusText.textContent = `Downloaded: ${filename}`;
      }

      downloadActiveBtn.addEventListener('click', downloadActiveFile);

      // Aspect ratio lock
      const ratioSelect = document.getElementById('ratio-select');
      const customRatioInputs = document.getElementById('custom-ratio-inputs');
      const ratioW = document.getElementById('ratio-w');
      const ratioH = document.getElementById('ratio-h');

      function updateAspectRatio() {
        const val = ratioSelect.value;
        if (val === 'free') {
          aspectRatio = null;
          customRatioInputs.style.display = 'none';
        } else if (val === 'custom') {
          customRatioInputs.style.display = 'flex';
          const w = parseFloat(ratioW.value) || 16;
          const h = parseFloat(ratioH.value) || 9;
          const ratio = w / h;
          aspectRatio = isFinite(ratio) && ratio > 0 ? ratio : null;
        } else {
          customRatioInputs.style.display = 'none';
          aspectRatio = parseFloat(val);
        }
        saveSettings();
      }

      ratioSelect.addEventListener('change', updateAspectRatio);
      ratioW.addEventListener('input', updateAspectRatio);
      ratioH.addEventListener('input', updateAspectRatio);

      document.getElementById('invert-ratio').addEventListener('click', () => {
        if (ratioSelect.value === 'free') {
          // If free, just swap the current selection's w and h
          const oldW = activeCrop.w;
          const oldH = activeCrop.h;
          activeCrop.w = oldH;
          activeCrop.h = oldW;
        } else {
          let w, h;
          if (ratioSelect.value === 'custom') {
            w = parseFloat(ratioW.value) || 16;
            h = parseFloat(ratioH.value) || 9;
          } else {
            const val = parseFloat(ratioSelect.value);
            if (val === 1) {
              w = 1;
              h = 1;
            } else if (val === 1.3333) {
              w = 4;
              h = 3;
            } else if (val === 1.5) {
              w = 3;
              h = 2;
            } else if (val === 1.7778) {
              w = 16;
              h = 9;
            } else {
              w = 1;
              h = 1 / val;
            }
          }

          // Swap inputs and set to custom
          ratioW.value = h;
          ratioH.value = w;
          ratioSelect.value = 'custom';
          updateAspectRatio();

          // Swap selection dimensions to match new ratio
          const oldW = activeCrop.w;
          const oldH = activeCrop.h;
          activeCrop.w = oldH;
          activeCrop.h = oldW;

          // Ensure it still matches ratio exactly after swap (in case of rounding)
          if (aspectRatio) {
            activeCrop.h = activeCrop.w / aspectRatio;
          }
        }

        clampCrop();
        updateInputs();
        updateCropBoxVisual();
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (!imgNatW) return;

        const step = e.shiftKey ? 10 : 1;

        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          activeCrop.x -= step;
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          activeCrop.x += step;
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeCrop.y -= step;
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeCrop.y += step;
        } else if (e.key === 'r' || e.key === 'R') {
          Object.assign(activeCrop, { x: 0, y: 0, w: imgNatW, h: imgNatH });
          clampCrop();
          updateInputs();
          updateCropBoxVisual();
          pushHistory();
          return;
        } else {
          return;
        }

        clampCrop();
        updateInputs();
        updateCropBoxVisual();
        if (!e.repeat) pushHistory();
      });

      const SETTINGS_KEY = 'batchcrop_settings';

      function saveSettings() {
        try {
          localStorage.setItem(
            SETTINGS_KEY,
            JSON.stringify({
              format: document.getElementById('export-format').value,
              quality: exportQuality,
              filenameTemplate,
              ratioSelect: ratioSelect.value,
              ratioW: parseFloat(ratioW.value) || 16,
              ratioH: parseFloat(ratioH.value) || 9,
              zoom,
              sortOrder,
              resizeEnabled,
              resizeW,
              resizeH,
              resizeMode,
              cropCollapsed: sectionCollapsed.crop,
              exportCollapsed: sectionCollapsed.export,
              presetsCollapsed: sectionCollapsed.presets,
            })
          );
        } catch (_) {}
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return;
          const s = JSON.parse(raw);
          const formatEl = document.getElementById('export-format');
          if (s.format) {
            formatEl.value = s.format;
            qualityContainer.style.display =
              s.format === 'image/jpeg' || s.format === 'image/webp' ? 'block' : 'none';
          }
          if (s.quality != null) {
            exportQuality = s.quality;
            exportQualityInput.value = s.quality;
            qualityVal.textContent = Math.round(s.quality * 100);
          }
          if (s.filenameTemplate != null) {
            filenameTemplate = s.filenameTemplate;
            filenameTemplateInput.value = s.filenameTemplate;

          if (s.ratioSelect) ratioSelect.value = s.ratioSelect;
          if (s.ratioW) ratioW.value = s.ratioW;
          if (s.ratioH) ratioH.value = s.ratioH;
          if (s.ratioSelect) updateAspectRatio();
          if (s.zoom != null) zoom = Math.min(8, Math.max(0.05, s.zoom));
          if (s.sortOrder) {
            sortOrder = s.sortOrder;

            resizeWInput.value = s.resizeW;

          if (s.resizeH) {

            resizeHInput.value = s.resizeH;

          if (s.exportCollapsed != null) sectionCollapsed.export = s.exportCollapsed;

        } catch (_) {}

      document.addEventListener('keydown', (e) => {

        const isUndo = (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z';
        const isRedo =
          ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'z') ||
          ((e.ctrlKey || e.metaKey) && e.key === 'y');
        if (!isUndo && !isRedo) return;
        e.preventDefault();
        if (isUndo && historyIndex > 0) {
          historyIndex--;

          updateInputs();
          updateCropBoxVisual();

      });

      const flipHBtn = document.getElementById('flip-h-btn');
      const flipVBtn = document.getElementById('flip-v-btn');

      flipHBtn.addEventListener('click', () => {

      const cropModeBtn = document.getElementById('crop-mode-btn');
      const cropInputEls = [inX, inY, inW, inH];

      cropModeBtn.addEventListener('click', () => {
        cropMode = cropMode === 'px' ? 'pct' : 'px';
        cropModeBtn.textContent = cropMode === 'pct' ? '%' : 'px';
        cropInputEls.forEach((el) => (el.step = cropMode === 'pct' ? '0.1' : '1'));
        updateInputs();

      // ── Presets ──────────────────────────────────────────────
      const PRESETS_KEY = 'batchcrop_presets';

      const BUILTIN_PRESETS = [
        { name: 'Square 1:1', ratio: 1 },
        { name: 'Portrait 4:5', ratio: 4 / 5 },
        { name: 'Story 9:16', ratio: 9 / 16 },
        { name: 'Landscape 16:9', ratio: 16 / 9 },
        { name: 'Twitter Header', ratio: 3 / 1 },
        { name: 'Classic 4:3', ratio: 4 / 3 },
      ];

      function loadUserPresets() {
        try {
          const raw = localStorage.getItem(PRESETS_KEY);
          userPresets = raw ? JSON.parse(raw) : [];
        } catch (_) {
          userPresets = [];
        }
      }

      function saveUserPresetsToStorage() {
        try {
          localStorage.setItem(PRESETS_KEY, JSON.stringify(userPresets));
        } catch (_) {}
      }

      function applyBuiltInPreset(ratio) {
        if (!imgNatW || !imgNatH) return;
        const imageRatio = imgNatW / imgNatH;
        let w, h;
        if (ratio >= imageRatio) {
          w = imgNatW;
          h = w / ratio;
        } else {
          h = imgNatH;
          w = h * ratio;
        }
        activeCrop.x = (imgNatW - w) / 2;
        activeCrop.y = (imgNatH - h) / 2;
        activeCrop.w = w;
        activeCrop.h = h;
        clampCrop();
        updateInputs();
        updateCropBoxVisual();
        pushHistory();
      }

      function applyUserPreset(preset) {
        if (!imgNatW) return;
        Object.assign(activeCrop, { x: preset.x, y: preset.y, w: preset.w, h: preset.h });
        clampCrop();
        updateInputs();
        updateCropBoxVisual();
        pushHistory();
      }

      function renderUserPresets() {
        const container = document.getElementById('user-presets');
        container.replaceChildren();
        userPresets.forEach((preset, i) => {
          const row = document.createElement('div');
          row.className = 'user-preset-row';

          const applyBtn = document.createElement('button');
          applyBtn.className = 'apply';
          applyBtn.textContent = preset.name;
          applyBtn.title =
            Math.round(preset.w) +
            ' x ' +
            Math.round(preset.h) +
            ' at (' +
            Math.round(preset.x) +
            ', ' +
            Math.round(preset.y) +
            ')';
          applyBtn.addEventListener('click', () => applyUserPreset(preset));

          const delBtn = document.createElement('button');
          delBtn.className = 'del';
          delBtn.textContent = '\xd7';
          delBtn.title = 'Delete preset';
          delBtn.addEventListener('click', () => {
            userPresets.splice(i, 1);
            saveUserPresetsToStorage();
            renderUserPresets();
          });

          row.appendChild(applyBtn);
          row.appendChild(delBtn);
          container.appendChild(row);
        });
      }

      // Render built-in preset chips
      const builtinContainer = document.getElementById('builtin-presets');
      BUILTIN_PRESETS.forEach((preset) => {
        const chip = document.createElement('button');
        chip.className = 'preset-chip';
        chip.textContent = preset.name;
        chip.addEventListener('click', () => applyBuiltInPreset(preset.ratio));
        builtinContainer.appendChild(chip);
      });

      // Save current crop as named preset
      document.getElementById('save-preset-btn').addEventListener('click', () => {
        const nameInput = document.getElementById('preset-name-input');
        const name = nameInput.value.trim();
        if (!name || !activeCrop.w || !activeCrop.h) return;
        userPresets.push({
          name,
          x: activeCrop.x,
          y: activeCrop.y,
          w: activeCrop.w,
          h: activeCrop.h,
        });
        saveUserPresetsToStorage();
        renderUserPresets();
        nameInput.value = '';
      });

      loadUserPresets();
      renderUserPresets();

      // ── Sort ─────────────────────────────────────────────────
      function applySortOrder() {
        if (!files.length) return;
        const activeFile = files[activeIndex];
        if (sortOrder === 'none') {
          files.sort((a, b) => a.originalIndex - b.originalIndex);
        } else {
          files.sort((a, b) => {
            if (sortOrder === 'name-asc') return a.file.name.localeCompare(b.file.name);
            if (sortOrder === 'name-desc') return b.file.name.localeCompare(a.file.name);
            if (sortOrder === 'size-asc') return a.file.size - b.file.size;
            if (sortOrder === 'size-desc') return b.file.size - a.file.size;
            if (sortOrder === 'status') return (a.done ? 1 : 0) - (b.done ? 1 : 0);
            return 0;
          });
        }
        activeIndex = files.indexOf(activeFile);
        renderFileList();
      }

      sortSelect.addEventListener('change', (e) => {
        sortOrder = e.target.value;
        applySortOrder();
        saveSettings();
      });

      resizeEnabledChk.addEventListener('change', () => {
        resizeEnabled = resizeEnabledChk.checked;
        resizeInputsDiv.style.display = resizeEnabled ? 'block' : 'none';
        saveSettings();
      });
      resizeWInput.addEventListener('input', () => {
        resizeW = parseInt(resizeWInput.value) || 0;
        saveSettings();
      });
      resizeHInput.addEventListener('input', () => {
        resizeH = parseInt(resizeHInput.value) || 0;
        saveSettings();
      });
      resizeModeSelect.addEventListener('change', () => {
        resizeMode = resizeModeSelect.value;
        saveSettings();
      });

      loadSettings();
      initCollapsible('crop-collapse-btn', 'crop-body', 'crop');
      initCollapsible('export-collapse-btn', 'export-body', 'export');
      initCollapsible('presets-toggle', 'presets-body', 'presets');
    </script>
  </body>
</html>
